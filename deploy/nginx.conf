# nginx server block for the portfolio.
# Static pages are served directly from dist/client; only /api/ goes to the Node server.
# Adjust server_name, paths and the TLS part (e.g. certbot) to your setup.

server {
    listen 80;
    server_name lucasmarfaing.pro www.lucasmarfaing.pro;

    root /var/www/portfolio/dist/client;
    index index.html;

    # Pages: plain static files
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Hashed assets (CSS, JS, images): cache for a year
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Contact form: forwarded to the small Node server
    location /api/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    error_page 404 /404.html;
}
